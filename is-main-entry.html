<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Main entry — IR Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122A44; --navy-2:#1C3A5A; --blue:#2F6690; --orange:#E8871E;
  --bg:#F6F7F9; --panel:#FFFFFF;
  --ink:#16232E; --ink-2:#4A5A6A; --ink-3:#7E8B98;
  --line:#E2E6EA; --line-2:#EEF1F3;
  --blue-100:#E9F0F5; --orange-100:#FCEEDD; --red:#9C2B1F; --red-100:#FBEAE7;
  --sans:'Outfit',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.rail{background:var(--navy);color:#fff;padding:24px 0;display:flex;flex-direction:column}
.rail .mark{font-size:12px;font-weight:600;letter-spacing:.04em;color:#93A8BC;padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.rail nav a{display:block;padding:10px 22px;color:#B9C8D6;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.rail nav a.active{background:rgba(255,255,255,.06);color:#fff;border-left-color:var(--orange);font-weight:500}
.rail nav a.inactive{opacity:.45;pointer-events:none;cursor:default}
.rail .who{margin-top:auto;padding:16px 22px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#93A8BC}
.rail .who strong{color:#fff;display:block;margin-top:2px}
.rail .logout{display:block;margin:10px 22px 0;font-size:12.5px;color:#93A8BC;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:var(--sans)}

.workspace{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.sectionnav{border-right:1px solid var(--line);padding:28px 14px;position:sticky;top:0;align-self:start;height:100vh;overflow-y:auto;background:var(--panel)}
.sectionnav .head{padding:0 10px 14px}
.sectionnav h1{font-size:17px;font-weight:600;margin:0}
.sectionnav .coachtype{color:var(--ink-2);font-size:13px}
.sectionnav .assignee{margin-top:10px;padding:9px 10px;background:var(--line-2);border-radius:7px;font-size:12.5px;color:var(--ink-2);line-height:1.5}
.sectionnav .assignee strong{color:var(--ink);font-weight:600}
.sectionnav .assignee:empty{display:none}
.sectionnav ol{list-style:none;margin:6px 0 0;padding:0}
.sectionnav li{margin-bottom:2px}
.sectionnav button{
  width:100%;text-align:left;background:none;border:none;padding:9px 10px;border-radius:7px;
  font-size:13.5px;color:var(--ink-2);cursor:pointer;display:flex;align-items:center;gap:9px;font-family:var(--sans)
}
.sectionnav button:hover:not(.inactive){background:var(--line-2)}
.sectionnav button.current{background:var(--blue-100);color:var(--blue);font-weight:600}
.sectionnav button.inactive{opacity:.4;cursor:default;pointer-events:none}
.dot{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:9px}
.dot.done{background:var(--orange);border-color:var(--orange);color:#fff}
.dot.current{border-color:var(--blue)}

main{padding:32px 46px 80px;max-width:700px}
.topline{color:var(--ink-3);font-size:13px;margin-bottom:2px}
.progresswrap{display:flex;align-items:center;gap:10px;margin:6px 0 28px}
.progresswrap .bar{flex:1;height:5px;background:var(--line-2);border-radius:3px;overflow:hidden}
.progresswrap .bar span{display:block;height:100%;width:0%;background:var(--orange)}
.progresswrap .pct{font-size:12px;color:var(--ink-3);font-weight:500}

.panel{display:none}
.panel.show{display:block}
.panel h2{font-size:19px;font-weight:600;margin:0 0 4px}
.panel .sub{color:var(--ink-3);font-size:13.5px;margin:0 0 20px}

.field{padding:16px 0;border-bottom:1px solid var(--line-2);display:grid;grid-template-columns:1fr 200px;gap:20px;align-items:center}
.field .label{font-size:14.5px}
.field .label .code{color:var(--ink-3);font-size:12px;display:block;margin-top:2px}
.field .tag{display:inline-block;font-size:10.5px;font-weight:500;color:var(--blue);background:var(--blue-100);padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:1px}
.field .tag-cai{display:inline-block;font-size:10.5px;font-weight:500;color:#6B3A00;background:#FCEEDD;padding:2px 8px;border-radius:5px;margin-left:8px;vertical-align:1px}
input, select, textarea{
  width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;
  font-family:var(--sans);font-size:14px;background:#fff;color:var(--ink)
}
input:focus, select:focus, textarea:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-100)}
textarea{resize:vertical;min-height:60px}
.fullrow{grid-template-columns:1fr}
.fullrow textarea{margin-top:8px}

.navbtns{display:flex;justify-content:space-between;margin-top:28px}
.navbtns button{font-family:var(--sans);font-size:14px;padding:10px 18px;border-radius:7px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink)}
.navbtns button:hover{background:var(--line-2)}
.navbtns button:disabled{opacity:.4;cursor:default}

.footer-bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);margin:36px -46px 0;padding:15px 46px;display:flex;justify-content:space-between;align-items:center}
.saved{font-size:13px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.saved .glow{width:7px;height:7px;border-radius:50%;background:var(--blue)}
.actions{display:flex;gap:10px}
.actions button{font-family:var(--sans);font-size:14px;padding:10px 20px;border-radius:7px;cursor:pointer;border:1px solid var(--line)}
.btn-secondary{background:#fff;color:var(--ink)}
.btn-secondary:hover{background:var(--line-2)}
.btn-primary{background:var(--orange);border-color:var(--orange);color:#3A2200;font-weight:600}
.btn-primary:hover{background:#D97A16}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px}
.dropdown{position:relative;display:inline-block}
.exp{font-family:var(--sans);font-size:13.5px;padding:8px 14px;border-radius:7px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:500;white-space:nowrap}
.exp:hover{background:var(--line-2)}
.exp.solid{background:var(--blue);border-color:var(--blue);color:#fff}
.exp.solid:hover,.exp.solid[aria-expanded="true"]{background:#255578;border-color:#255578}
.exp svg{transition:transform .15s}.exp[aria-expanded="true"] svg{transform:rotate(180deg)}
.menu{display:none;position:absolute;right:0;top:calc(100% + 6px);min-width:130px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(18,42,68,.12);padding:5px;z-index:50}
.menu.show{display:block}
.menu button{display:block;width:100%;text-align:left;border:none;background:none;font-family:var(--sans);font-size:14px;color:var(--ink);padding:9px 12px;border-radius:6px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--blue-100);color:var(--blue);outline:none}
.exp:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.panelhead{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:20px}
.panelhead .sub{margin-bottom:0}
.dot.partial{border-color:var(--orange);background:linear-gradient(90deg,var(--orange) 50%,transparent 50%)}
.field.field-flagged{background:var(--red-100);border-radius:8px;margin:0 -14px;padding-left:14px;padding-right:14px}
.flagged-input{border-color:var(--red)!important;background:#fff}
.flagcount{color:var(--red);font-weight:500}
.nm{flex:1;min-width:0}
.cnt{margin-left:auto;font-size:11.5px;color:var(--ink-3);font-weight:500}
.sectionnav button.current .cnt{color:var(--blue)}
input:disabled,select:disabled,textarea:disabled{background:var(--line-2);color:var(--ink-2);cursor:default}
/* Phase nav in sidebar */
.phase-group{margin-bottom:12px}
.phase-label{font-size:11px;font-weight:600;letter-spacing:.06em;color:#93A8BC;padding:8px 10px 4px;text-transform:uppercase}
.phase-label.active-phase{color:var(--orange)}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="mark">DIMS</div>
    <nav>
      <a href="#" id="homeLink">My assignments</a>
      <a href="critical-parameters.html">Critical Parameters</a>
    </nav>
    <div class="who">
      Logged in as<strong id="userName">—</strong>
      <button class="logout" onclick="logout()">Sign out</button>
    </div>
  </aside>

  <div class="workspace">
    <aside class="sectionnav">
      <div class="head">
        <h1 id="coachNo">Coach —</h1>
        <div class="coachtype" id="coachType">LHB Non-AC</div>
        <div class="assignee" id="assignee"></div>
      </div>
      <!-- Phase groups injected by JS -->
      <div id="navlist"></div>
    </aside>

    <main>
      <div class="topbar">
        <div class="topline">Section <span id="secnum">1</span> of <span id="sectotal">—</span> · <span id="doneCount">0</span> complete<span id="flagLine"></span></div>
        <div id="sheetExport"></div>
      </div>
      <div class="progresswrap">
        <div class="bar"><span id="progressbar"></span></div>
        <span class="pct" id="progresspct">0%</span>
      </div>

      <!-- Panels injected by JS based on inspection_stage -->
      <div id="panelContainer"></div>

      <div class="navbtns">
        <button id="prevBtn">← Previous section</button>
        <button id="nextBtn">Next section →</button>
      </div>

      <div class="footer-bar">
        <div class="saved"><span class="glow"></span><span id="savedText">Not saved yet</span></div>
        <div class="actions">
          <button class="btn-secondary" id="saveBtn">Save and continue</button>
          <button class="btn-primary" id="submitBtn">Submit</button>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="api.js"></script>
<script>if (typeof requireAuth === "undefined") document.body.innerHTML = '<p style="font:16px sans-serif;padding:40px;max-width:520px">api.js was not found next to this page. Keep api.js in the same folder as the HTML files.</p>';</script>
<script>
"use strict";
// ── Bootstrap: auth and visit ──
requireAuth();
const me = getUser();
const params = new URLSearchParams(location.search);
const visit = getVisit(+params.get("visit_id") || 1);
// A coach reassigned away from this inspector stays viewable but can no longer be edited by them
const notMine = !!visit && me?.role === ROLE_IS && visit.assigned_to !== me.id;
const readOnly = params.get("readonly") === "1" || visit?.status === "SUBMITTED" || notMine;
const $ = id => document.getElementById(id);

// Where does this user go "home"?
$("homeLink").href = homeFor(me);
$("homeLink").textContent = me?.is_mgmt_staff ? "Summary" : "My assignments";
$("userName").textContent = (me?.full_name || "") + " · " + (me?.role || "IS");

// ── Determine which phase this sheet shows ──
// The visit's own stage decides the form (assignments only go to staff of that stage);
// with no visit, IS staff fall back to their inspection_stage and SSE / MG to pre-inspection.
const myStage = visit?.inspection_phase
  || ((me?.role === ROLE_IS) ? (me.inspection_stage || STAGE_PRE) : STAGE_PRE);

// Phase meta (all three always shown in sidebar; only myStage is active)
const PHASES = [
  { id: STAGE_PRE,   label: "Pre-inspection",      sections: SECTION_NAMES_PRE,   fields: FORM_FIELDS_PRE },
  { id: STAGE_POH,   label: "POH / Modification",  sections: SECTION_NAMES_POH,   fields: FORM_FIELDS_POH },
  { id: STAGE_FINAL, label: "Final inspection",     sections: SECTION_NAMES_FINAL, fields: FORM_FIELDS_FINAL }
];
const activePhase = PHASES.find(p => p.id === myStage) || PHASES[0];
const SECTIONS   = activePhase.sections;
const FIELDS     = activePhase.fields;

// ── Build panels from schema ──
// Field type heuristics
function fieldType(label) {
  const l = label.toLowerCase();
  if (/\b(amp|mΩ|°c|minute|position|make|make of|name|remarks|replaced|list|observations|sign-off|deficiency)\b/.test(l)) {
    if (/remarks|deficiency|observations|list|items|sign-off/.test(l)) return "textarea";
    if (/make of|manufacturer|name|make$/.test(l)) return "text";
    return "number";
  }
  return "select";
}

function selectOptionsFor(label) {
  const l = label.toLowerCase();
  if (/status/.test(l) && /diesel/.test(l)) return ["Full", "Empty", "Partially filled"];
  if (/battery|cell.*connection/.test(l)) return ["Disconnected", "Not disconnected"];
  if (/earthing device|shut.off|earthing verified/.test(l)) return ["Earthed", "Not earthed"];
  if (/cai|modification|rodent|transformer|wiring|insulation|inspection|protection|service|overhaul|calibration|refurbishment|replacement|fitment|bonding|bus check|circuit|coupler|buffer|bogie|door/.test(l)) return ["Done", "Not done", "Not applicable"];
  if (/ebc|rbc|functional|fan|pa |emergency|working/.test(l)) return ["Working", "Not working"];
  if (/mmr|contactor|filter|tube|window|floor|roof|body|fire|extinguisher|exit/.test(l)) return ["OK", "Not OK"];
  if (/earthing$/.test(l)) return ["OK", "Not OK"];
  if (/hp cut|lp cut|power panel|make$/.test(l)) return ["OK", "Not OK"];
  return ["OK", "Not OK"];
}

const isMissionCritical = (phaseId, si, fi) => {
  if (phaseId !== STAGE_PRE) return false;
  return MISSION_CRITICAL_PARAMS.some(p => p.section === si && p.index === fi);
};
const isCAI = (phaseId, si) => phaseId === STAGE_POH && si === 0;

function buildField(phaseId, si, fi, label) {
  const mc = isMissionCritical(phaseId, si, fi);
  const cai = isCAI(phaseId, si);
  const type = fieldType(label);
  const isTextarea = type === "textarea";
  const isText = type === "text" || type === "textarea";

  let inputHtml;
  if (type === "select") {
    const opts = selectOptionsFor(label);
    inputHtml = `<select data-si="${si}" data-fi="${fi}"><option value="">Select</option>${opts.map(o => `<option>${o}</option>`).join("")}</select>`;
  } else if (type === "textarea") {
    inputHtml = `<textarea data-si="${si}" data-fi="${fi}" placeholder="Enter details"></textarea>`;
  } else if (type === "text") {
    inputHtml = `<input type="text" data-si="${si}" data-fi="${fi}" placeholder="Enter value">`;
  } else {
    inputHtml = `<input type="number" data-si="${si}" data-fi="${fi}" placeholder="0.0">`;
  }

  const mcBadge = mc ? '<span class="tag">Mission-critical</span>' : "";
  const caiBadge = cai ? '<span class="tag-cai">CAI</span>' : "";
  const cls = isTextarea ? "field fullrow" : "field";
  return `<div class="${cls}" data-field-si="${si}" data-field-fi="${fi}">
    <div class="label">${esc(label)}${mcBadge}${caiBadge}</div>
    ${isTextarea ? inputHtml : inputHtml}
  </div>`;
}

const panelContainer = $("panelContainer");
SECTIONS.forEach((name, si) => {
  const div = document.createElement("div");
  div.className = "panel" + (si === 0 ? " show" : "");
  div.dataset.section = si;
  const fieldsHtml = FIELDS[si].map((label, fi) => buildField(activePhase.id, si, fi, label)).join("");
  div.innerHTML = `<div class="panelhead"><div><h2>${esc(name)}</h2><p class="sub">&nbsp;</p></div></div>${fieldsHtml}`;
  panelContainer.appendChild(div);
});

const panels = [...panelContainer.querySelectorAll(".panel")];
const controls = i => [...panels[i].querySelectorAll("input,select,textarea")];
const isFilled = c => c.value.trim() !== "" && c.value !== "Select" && c.value !== "";

function stat(i) {
  const req = controls(i).filter(c => c.tagName !== "TEXTAREA");
  const n = req.filter(isFilled).length;
  return { n, total: req.length, status: n === 0 ? "empty" : n === req.length ? "done" : "partial" };
}
const doneCount = () => SECTIONS.filter((_, i) => stat(i).status === "done").length;
const snapshot = () => panels.map((_, i) => controls(i).map(c => c.value));

// ── Sidebar nav ──
// Three phase groups. Active phase shows section buttons. Other phases show as greyed-out group label only.
const navlist = $("navlist");

PHASES.forEach(phase => {
  const isActive = phase.id === activePhase.id;
  const group = document.createElement("div");
  group.className = "phase-group";

  const phaseLabel = document.createElement("div");
  phaseLabel.className = "phase-label" + (isActive ? " active-phase" : "");
  phaseLabel.textContent = phase.label;
  group.appendChild(phaseLabel);

  if (isActive) {
    const ol = document.createElement("ol");
    ol.style.listStyle = "none"; ol.style.margin = "0"; ol.style.padding = "0";
    SECTIONS.forEach((name, i) => {
      const li = document.createElement("li"), btn = document.createElement("button");
      btn.innerHTML = `<span class="dot" id="dot-${i}"></span><span class="nm">${name}</span><span class="cnt" id="cnt-${i}"></span>`;
      btn.id = "navbtn-" + i;
      btn.onclick = () => goTo(i);
      li.appendChild(btn); ol.appendChild(li);
    });
    group.appendChild(ol);
  } else {
    // Greyed-out section stubs for non-active phases
    const ol = document.createElement("ol");
    ol.style.listStyle = "none"; ol.style.margin = "0"; ol.style.padding = "0";
    phase.sections.forEach(name => {
      const li = document.createElement("li"), btn = document.createElement("button");
      btn.className = "inactive";
      btn.innerHTML = `<span class="dot"></span><span class="nm">${name}</span>`;
      li.appendChild(btn); ol.appendChild(li);
    });
    group.appendChild(ol);
  }
  navlist.appendChild(group);
});

let current = 0;

function render() {
  panels.forEach((p, i) => p.classList.toggle("show", i === current));
  document.querySelectorAll("#navlist button:not(.inactive)").forEach((b, i) => b.classList.toggle("current", i === current));
  let done = 0;
  SECTIONS.forEach((_, i) => {
    const s = stat(i), dot = $("dot-" + i);
    if (!dot) return;
    dot.className = "dot" + (s.status === "done" ? " done" : s.status === "partial" ? " partial" : "") + (i === current && s.status !== "done" ? " current" : "");
    dot.textContent = s.status === "done" ? "✓" : "";
    const cnt = $("cnt-" + i);
    if (cnt) cnt.textContent = s.n + "/" + s.total;
    if (s.status === "done") done++;
  });

  // Flag highlighting (only meaningful for pre-inspection which has MIN_SPEC)
  let flaggedCount = 0;
  if (activePhase.id === STAGE_PRE) {
    panels.forEach((p, si) => controls(si).forEach((c, fi) => {
      if (FIELDS[si][fi] === "Any other deficiency") return;
      const flagged = paramState(si, fi, c.value.trim()) === "flagged";
      c.classList.toggle("flagged-input", flagged);
      c.closest(".field").classList.toggle("field-flagged", flagged);
      if (flagged) flaggedCount++;
    }));
  }
  $("flagLine").textContent = flaggedCount ? ` · ${flaggedCount} flagged` : "";
  $("flagLine").className = flaggedCount ? "flagcount" : "";

  const pct = Math.round(done / SECTIONS.length * 100);
  $("secnum").textContent = current + 1;
  $("sectotal").textContent = SECTIONS.length;
  $("doneCount").textContent = done;
  $("progressbar").style.width = pct + "%";
  $("progresspct").textContent = pct + "%";
  $("prevBtn").disabled = current === 0;
  $("nextBtn").disabled = current === SECTIONS.length - 1;
}

function goTo(i) { current = i; render(); }
$("prevBtn").onclick = () => goTo(Math.max(0, current - 1));
$("nextBtn").onclick = () => goTo(Math.min(SECTIONS.length - 1, current + 1));
panelContainer.addEventListener("input", render);
panelContainer.addEventListener("change", render);

// ── Export (SSE / HOD only) ──
const canExport = me?.is_mgmt_staff;
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function sectionRows(i) {
  return [...panels[i].querySelectorAll(".field")].map(f => {
    const lab = f.querySelector(".label"), c = f.querySelector("input,select,textarea");
    const code = lab.querySelector(".code");
    return [lab.firstChild.textContent.trim(), code ? code.textContent.trim() : "", lab.querySelector(".tag") ? "Yes" : "No", isFilled(c) ? c.value.trim() : "Not entered"];
  });
}
let coachNo = "coach";
function exportSection(i, format) {
  exportRows(exportFileBase(coachNo, slug(SECTIONS[i])), `Coach ${coachNo} — ${SECTIONS[i]}`,
    ["Parameter", "Spec / code", "Mission-critical", "Value"], sectionRows(i), format);
}
function exportSheet(format) {
  const rows = [];
  SECTIONS.forEach((name, i) => sectionRows(i).forEach(r => rows.push([name, ...r])));
  const who = visit ? ` — ${staffLabel(visit.assigned_to_name, visit.assigned_to_login)}, ${visit.section_code ? sectionName(visit.section_code) + " section" : "no section"}` : "";
  exportRows(exportFileBase(coachNo, activePhase.id + "-sheet"), `Coach ${coachNo} — ${activePhase.label}${who}`,
    ["Section", "Parameter", "Spec / code", "Mission-critical", "Value"], rows, format);
}
function closeMenus() { document.querySelectorAll(".menu.show").forEach(m => { m.classList.remove("show"); m.previousElementSibling.setAttribute("aria-expanded", "false"); }); }
function exportDropdown(label, solid, onPick) {
  const wrap = document.createElement("div"); wrap.className = "dropdown";
  wrap.innerHTML = `<button type="button" class="exp${solid ? " solid" : ""}" aria-haspopup="menu" aria-expanded="false">${label}
      <svg width="10" height="6" viewBox="0 0 10 6" aria-hidden="true"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="menu" role="menu"><button type="button" role="menuitem" data-f="csv">CSV</button><button type="button" role="menuitem" data-f="excel">Excel</button><button type="button" role="menuitem" data-f="pdf">PDF</button></div>`;
  const btn = wrap.querySelector(".exp"), menu = wrap.querySelector(".menu");
  btn.onclick = e => {
    e.stopPropagation();
    const open = !menu.classList.contains("show");
    closeMenus();
    menu.classList.toggle("show", open); btn.setAttribute("aria-expanded", open);
    if (open) menu.querySelector("button").focus();
  };
  menu.onclick = e => { const b = e.target.closest("button[data-f]"); if (b) { closeMenus(); onPick(b.dataset.f); } };
  menu.onkeydown = e => {
    const items = [...menu.querySelectorAll("button")], i = items.indexOf(document.activeElement);
    if (e.key === "ArrowDown") { e.preventDefault(); items[(i + 1) % items.length].focus(); }
    if (e.key === "ArrowUp") { e.preventDefault(); items[(i - 1 + items.length) % items.length].focus(); }
    if (e.key === "Escape") { closeMenus(); btn.focus(); }
  };
  return wrap;
}
document.addEventListener("click", closeMenus);

if (canExport) {
  panels.forEach((p, i) => {
    const panelhead = p.querySelector(".panelhead");
    if (panelhead) panelhead.appendChild(exportDropdown("Export section", false, f => exportSection(i, f)));
  });
  $("sheetExport").appendChild(exportDropdown("Export entire sheet", true, exportSheet));
}

// ── Coach / visit wiring ──
const TYPE_NAMES = { LHB_NON_AC: "LHB Non-AC", LHB_AC: "LHB AC", ICF_NON_AC: "ICF Non-AC", ICF_AC: "ICF AC" };

if (visit) {
  coachNo = visit.coach_number;
  $("coachNo").textContent = "Coach " + visit.coach_number;
  $("coachType").textContent = (TYPE_NAMES[visit.coach_type] || visit.coach_type) + " · " + activePhase.label;
  document.title = "Main entry — Coach " + visit.coach_number;
  $("assignee").innerHTML = `Inspector <strong>${esc(visit.assigned_to_name || "—")}</strong> · ${esc(visit.assigned_to_login || "—")}<br>${visit.section_code ? esc(sectionName(visit.section_code)) + " section" : "No section"}`;

  // Restore saved values or fill demo data (pre-inspection only)
  if (visit.entry && visit.entry.length === panels.length) {
    visit.entry.forEach((vals, i) => controls(i).forEach((c, k) => { if (vals[k] !== undefined) c.value = vals[k]; }));
  } else if (DEMO_DATA && activePhase.id === STAGE_PRE) {
    const entry = demoEntryFor(visit.id);
    if (entry) {
      const upTo = visit.status === "SUBMITTED" ? SECTIONS.length : (visit.id === 1 ? 4 : (visit.sections_completed || 0));
      for (let i = 0; i < upTo && i < panels.length; i++) {
        controls(i).forEach((c, k) => { if (entry[i] && entry[i][k]) c.value = entry[i][k]; });
      }
    }
  }

  const firstOpen = SECTIONS.findIndex((_, i) => stat(i).status !== "done");
  current = readOnly || firstOpen < 0 ? 0 : firstOpen;

  const savedText = $("savedText");
  savedText.textContent = notMine ? `Reassigned to ${staffLabel(visit.assigned_to_name, visit.assigned_to_login)} — view only`
    : readOnly ? "View only" : (visit.last_saved_on ? "Last saved " + fmtDateTime(visit.last_saved_on) : "Not saved yet");
  if (visit.last_reassignment) {
    const r = visit.last_reassignment;
    $("assignee").innerHTML += `<br>Reassigned from ${esc(staffLabel(r.from_name, r.from_login))} · ${esc(REASSIGN_REASONS[r.reason] || r.reason)}`;
  }

  if (readOnly) {
    panelContainer.querySelectorAll("input,select,textarea").forEach(el => el.disabled = true);
    $("saveBtn").style.display = $("submitBtn").style.display = "none";
  }

  $("saveBtn").onclick = () => {
    if (!saveVisitProgress(visit.id, doneCount(), snapshot()))
      return showToast("This coach is no longer assigned to you, so it can't be saved.", "error");
    savedText.textContent = "Last saved just now";
    showToast("Progress saved.");
    if (current < SECTIONS.length - 1) goTo(current + 1);
  };

  $("submitBtn").onclick = () => {
    const firstIncomplete = SECTIONS.findIndex((_, i) => stat(i).status !== "done");
    if (firstIncomplete >= 0) {
      showToast("Every parameter must be recorded before you can submit — " + SECTIONS[firstIncomplete] + " is incomplete.", "error");
      goTo(firstIncomplete);
      return;
    }
    if (!submitVisit(visit.id, doneCount(), snapshot()))
      return showToast("This coach is no longer assigned to you, so it can't be submitted.", "error");
    showToast("Inspection submitted.");
    setTimeout(() => { location.href = homeFor(me); }, 900);
  };
} else {
  $("coachNo").textContent = "No coach selected";
  $("coachType").textContent = "Open a coach from your assignments";
  $("savedText").textContent = "";
  $("saveBtn").style.display = $("submitBtn").style.display = "none";
  $("sheetExport").style.display = "none";
}

render();
</script>
</body>
</html>
