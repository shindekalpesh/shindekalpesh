<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My assignments — IR Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#122A44;--navy2:#1C3A5A;--blue:#2F6690;--orange:#E8871E;
  --bg:#F6F7F9;--panel:#fff;
  --ink:#16232E;--ink2:#4A5A6A;--ink3:#7E8B98;
  --line:#E2E6EA;--line2:#EEF1F3;
  --blue100:#E9F0F5;--orange100:#FCEEDD;
  --sans:'Outfit',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
.rail{background:var(--navy);padding:24px 0;display:flex;flex-direction:column}
.rail .mark{font-size:11.5px;font-weight:600;letter-spacing:.06em;color:#93A8BC;padding:0 22px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px}
.rail a{display:block;padding:10px 22px;color:#B9C8D6;text-decoration:none;font-size:14px;border-left:3px solid transparent}
.rail a.active{background:rgba(255,255,255,.06);color:#fff;border-left-color:var(--orange);font-weight:500}
.rail a:hover:not(.active){background:rgba(255,255,255,.04)}
.rail .who{margin-top:auto;padding:16px 22px 0;border-top:1px solid rgba(255,255,255,.12);font-size:13px;color:#93A8BC}
.rail .who strong{color:#fff;display:block;margin-top:2px}
.rail .logout{display:block;margin:10px 22px 0;font-size:12.5px;color:#93A8BC;cursor:pointer;text-decoration:underline;background:none;border:none;font-family:var(--sans)}
main{padding:32px 44px 60px;min-width:0}
h1{font-size:21px;font-weight:600}
.titlewrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.today{font-size:12.5px;font-weight:500;color:var(--blue);background:var(--blue100);padding:4px 10px;border-radius:6px;white-space:nowrap}
.meta{color:var(--ink3);font-size:13.5px;margin:4px 0 22px}
.btn{font-family:var(--sans);font-size:14px;padding:9px 18px;border-radius:7px;cursor:pointer;border:none;font-weight:600}
.btn-orange{background:var(--orange);color:#3A2200}.btn-orange:hover{background:#D97A16}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500}.btn-ghost:hover{background:var(--line2)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.resume{display:none;align-items:center;justify-content:space-between;gap:16px;background:var(--navy);color:#fff;border-radius:10px;padding:16px 20px;margin-bottom:20px}
.resume.show{display:flex}
.resume .k{font-size:12px;color:#93A8BC;font-weight:500}
.resume .t{font-size:16px;font-weight:600;margin-top:2px}
.resume .s{font-size:13px;color:#B9C8D6;margin-top:1px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:22px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px}
.stat .lbl{font-size:12.5px;color:var(--ink3);font-weight:500}
.stat .num{font-size:27px;font-weight:600;margin-top:4px;color:var(--navy)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tabs{display:flex;gap:4px;background:#fff;border:1px solid var(--line);border-radius:8px;padding:3px}
.tab{border:none;background:none;font-family:var(--sans);font-size:13.5px;font-weight:500;color:var(--ink2);padding:7px 14px;border-radius:6px;cursor:pointer}
.tab.active{background:var(--navy);color:#fff}
.tab .n{opacity:.7;margin-left:4px}
.search{border:1px solid var(--line);border-radius:7px;padding:9px 12px;font-size:13.5px;font-family:var(--sans);width:200px;background:#fff}
.pill{font-size:12px;padding:3px 10px;border-radius:6px;font-weight:500;white-space:nowrap}
.pill-orange{background:var(--orange100);color:#8A5410}.pill-blue{background:var(--blue100);color:var(--blue)}.pill-gray{background:var(--line2);color:var(--ink2)}
.track{height:5px;background:var(--line2);border-radius:3px;overflow:hidden;min-width:70px}
.track span{display:block;height:100%;background:var(--orange);border-radius:3px}
.track.done span{background:var(--blue)}
.ts{color:var(--ink3);font-size:13px}
.empty{text-align:center;padding:48px 20px;color:var(--ink3);background:#fff;border:1px dashed var(--line);border-radius:10px}
.empty strong{display:block;color:var(--ink2);font-size:15px;margin-bottom:4px}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy);color:#fff;padding:11px 18px;border-radius:8px;font-size:13.5px;display:none;z-index:200}
.toast.show{display:block}
.table-wrap{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;color:var(--ink3);font-weight:500;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#FAFAF9}
td.coach{font-weight:600;color:var(--navy)}
td.pgc{min-width:150px}
td.pgc small{display:block;font-size:12px;color:var(--ink3);margin-top:4px}
td.act{text-align:right}
td.act .btn{padding:7px 16px}
@media (max-width:820px){.shell{grid-template-columns:1fr}.rail{display:none}main{padding:22px 16px 48px}.stats{grid-template-columns:1fr 1fr 1fr;gap:8px}.stat .num{font-size:22px}}
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="mark">IR-WORKSHOP / PL</div>
    <nav>
      <a class="active" href="is-summary.html">My assignments</a>
      <a href="critical-tasks.html">Critical tasks</a>
    </nav>
    <div class="who">Logged in as<strong id="userName">—</strong>
      <button class="logout" onclick="logout()">Sign out</button></div>
  </aside>
  <main>
    <div class="titlewrap">
      <h1>My assignments</h1>
      <span class="today" id="todayDate" aria-label="Today's date"></span>
    </div>
    <p class="meta">Coaches assigned to you — today and previous 3 days</p>

    <div class="resume" id="resume">
      <div><div class="k">Pick up where you left off</div><div class="t" id="resumeTitle"></div><div class="s" id="resumeSub"></div></div>
      <button class="btn btn-orange" id="resumeBtn">Continue</button>
    </div>

    <div class="stats">
      <div class="stat"><div class="lbl">Assigned to me</div><div class="num" id="stAll">—</div></div>
      <div class="stat"><div class="lbl">In progress</div><div class="num" id="stProg">—</div></div>
      <div class="stat"><div class="lbl">Submitted today</div><div class="num" id="stDone">—</div></div>
    </div>

    <div class="bar">
      <div class="tabs" role="tablist" id="tabs">
        <button class="tab active" data-f="ALL" role="tab">All<span class="n" id="nAll"></span></button>
        <button class="tab" data-f="IN_PROGRESS" role="tab">In progress<span class="n" id="nProg"></span></button>
        <button class="tab" data-f="SUBMITTED" role="tab">Submitted<span class="n" id="nDone"></span></button>
      </div>
      <input class="search" id="q" type="search" placeholder="Search coach number" aria-label="Search coach number">
    </div>

    <div id="list"></div>
  </main>
</div>
<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script>if (typeof requireAuth === "undefined") document.body.innerHTML = '<p style="font:16px sans-serif;padding:40px;max-width:520px">api.js was not found next to this page. Keep api.js in the same folder as the HTML files.</p>';</script>
<script>
// Date pill (independent of api.js so it always shows)
(function(){const el=document.getElementById("todayDate");
  const show=()=>el.textContent=new Date().toLocaleDateString("en-IN",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
  show();setInterval(show,60000);})();

const $ = id => document.getElementById(id);
const TYPES = {LHB:"LHB", NEW_LHB:"New LHB", THERMAL_LHB:"Thermal LHB", THERMAL_SG:"Thermal SG"};

requireAuth();
const user = getUser();
if (user?.is_mgmt_staff) location.replace(MGMT_HOME); // SSE / HOD accounts belong on their own page
$("userName").textContent = (user?.full_name || user?.username || "Inspection Staff") + " · IS";

let all = [], filter = "ALL";

async function loadVisits() {
  const res = await apiFetch(`${API}/visits/`);   // this user's assignments only
  if (!res) return;
  all = await res.json();
  refresh();
}

function fmt(t){ return t ? new Date(t).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}) : "Not started"; }
function pill(v){
  if (v.status === "SUBMITTED") return '<span class="pill pill-blue">Submitted</span>';
  if (v.status === "IN_PROGRESS") return v.flagged_count > 0
    ? `<span class="pill pill-orange">${v.flagged_count} flagged</span>` : '<span class="pill pill-gray">In progress</span>';
  return '<span class="pill pill-gray">To do</span>';
}
function prog(v){
  const total = v.sections_total || 8, done = v.sections_completed ?? (v.status === "SUBMITTED" ? total : null);
  if (done === null) return null;
  return {done, total, pct: Math.round(done/total*100)};
}
function track(v){ const p = prog(v); return p ? `<div class="track ${v.status==="SUBMITTED"?"done":""}"><span style="width:${p.pct}%"></span></div>` : ""; }
function action(v){
  const label = v.status === "SUBMITTED" ? "View" : v.status === "IN_PROGRESS" ? "Continue" : "Start";
  const cls = v.status === "SUBMITTED" ? "btn-ghost" : "btn-orange";
  return `<button class="btn ${cls}" onclick="openVisit(${v.id},'${v.status}')">${label}</button>`;
}
function openVisit(id, status) {
  location.href = `is-main-entry.html?visit_id=${id}${status === "SUBMITTED" ? "&readonly=1" : ""}`;
}

function render(list) {
  const box = $("list");
  box.className = "";
  if (!list.length) { box.innerHTML = `<div class="empty"><strong>No assignments to show</strong>Your SSE / HOD will assign coaches to you. New ones appear here automatically.</div>`; return; }
  box.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Coach</th><th>Type</th><th>Status</th><th>Progress</th><th>Last saved</th><th></th></tr>
    ${list.map(v => { const p = prog(v); return `<tr>
      <td class="coach">${esc(v.coach_number)}</td>
      <td>${esc(TYPES[v.coach_type] || v.coach_type)}</td>
      <td>${pill(v)}</td>
      <td class="pgc">${p ? `${track(v)}<small>${p.done} of ${p.total} sections</small>` : "—"}</td>
      <td class="ts">${fmt(v.last_saved_on)}</td>
      <td class="act">${action(v)}</td>
    </tr>`; }).join("")}
  </table></div>`;
}

function refresh() {
  const today = new Date().toISOString().slice(0,10);
  const prog_ = all.filter(v => v.status === "IN_PROGRESS"), done = all.filter(v => v.status === "SUBMITTED");
  $("stAll").textContent = all.length; $("stProg").textContent = prog_.length;
  $("stDone").textContent = done.filter(v => v.submitted_on?.slice(0,10) === today).length;
  $("nAll").textContent = all.length; $("nProg").textContent = prog_.length; $("nDone").textContent = done.length;

  const last = [...prog_].sort((a,b) => new Date(b.last_saved_on||0) - new Date(a.last_saved_on||0))[0];
  $("resume").classList.toggle("show", !!last);
  if (last) {
    const p = prog(last);
    $("resumeTitle").textContent = `Coach ${last.coach_number} · ${TYPES[last.coach_type] || last.coach_type}`;
    $("resumeSub").textContent = (p ? `${p.done} of ${p.total} sections complete · ` : "") + "saved " + fmt(last.last_saved_on);
    $("resumeBtn").onclick = () => openVisit(last.id, last.status);
  }

  const q = $("q").value.trim().toLowerCase();
  render(all.filter(v => (filter === "ALL" || v.status === filter) && v.coach_number.toLowerCase().includes(q)));
}

$("tabs").addEventListener("click", e => {
  const b = e.target.closest(".tab"); if (!b) return;
  document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === b));
  filter = b.dataset.f; refresh();
});
$("q").addEventListener("input", refresh);

function toast(m){ const t=$("toast"); t.textContent=m; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),2400); }
function logout(){ clearSession(); location.href = LOGIN_PAGE; }

loadVisits();
setInterval(loadVisits, 60000);
</script>
</body>
</html>
